# Contract: Events
# Owner: Phương | Status: Active — SSoT for the event bus, job queue, and all typed events
# This file is the sole Single Source of Truth for all typed event names, publishers,
# subscribers, and complete payload shapes on the bus. Module contracts reference these
# definitions and must not duplicate reduced payload schemas.
# See also: kb/modules/event-infrastructure.md, ADR-0005, ADR-0006, ADR-0011, ADR-0013

# ---------------------------------------------------------------------------
# Shared envelope — every event published on IEventBus is wrapped in this
# envelope. `payload` holds the event-specific data documented in `events:`.
# Wrapping is done automatically by IEventBus.publish() — callers only pass
# eventType + payload (+ optional correlationId).
# ---------------------------------------------------------------------------
entities:
  EventEnvelope:
    fields:
      eventId: UUID            # Unique ID for this event occurrence — used as an idempotency key by subscribers
      eventType: string        # e.g. "BacktestCompleted" — must be one of the names in `events:` below
      eventVersion: number     # Schema version of the payload, starts at 1. Bump on breaking payload changes.
      occurredAt: DateTime     # When the event was created (ISO8601, UTC)
      correlationId: UUID      # Ties together all events for one logical request (one backtest, one loop run)
      payload: object          # Event-specific payload — see `events:` section

  JobRequest:
    fields:
      jobId: UUID              # Primary key generated by the BacktestRequested producer; queue preserves it unchanged
      jobType: string          # "BACKTEST" is the only job type in the MVP; field exists for future job types
      payload: object          # e.g. the BacktestRequested payload
      attempt: number          # Current attempt count, starts at 1
      maxAttempts: number      # Default 3 — see retry_policy below
      correlationId: UUID
      createdAt: DateTime
      availableAt: DateTime    # Derived from BullMQ waiting/delayed state; job is not eligible before this time

  JobStatus:
    fields:
      jobId: UUID
      status: string           # "QUEUED" | "PROCESSING" | "COMPLETED" | "FAILED" | "DEAD_LETTER"
      attempt: number
      lastError: string        # nullable — set when status is FAILED or DEAD_LETTER
      updatedAt: DateTime

  QueueStats:
    fields:
      queued: number
      processing: number
      completedLast24h: number
      deadLettered: number
      delayed: number           # Jobs waiting for a BullMQ retry delay
      redisConnected: boolean

  LeaderboardEntryPayload:
    fields:
      rank: number
      userId: UUID?              # null = system entry (shared), non-null = user entry (private). See ADR-0016
      strategyVersionId: UUID
      strategyName: string
      strategyType: string      # "MA" | "RSI" | "Bollinger" | "SR" | "Sentiment" | "Composite"
      isComposite: boolean
      backtestResultId: UUID
      score: number              # Computed leaderboard score — see kb/modules/event-infrastructure.md Section 3 (Observer)
      totalReturn: float
      winRate: float
      maxDrawdown: float
      sharpeRatio: float
      totalTrades: number

enums:
  JobStatusValue: ["QUEUED", "PROCESSING", "COMPLETED", "FAILED", "DEAD_LETTER"]
  BacktestSource: ["USER", "SEARCH_LOOP"]
  LoopStatus: ["RUNNING", "PAUSED", "COMPLETED", "STOPPED_BY_USER", "FAILED"]

interfaces:
  IEventBus:
    description: >
      Typed pub/sub abstraction wrapping EventEmitter2 (ADR-0005). All cross-module communication
      goes through this interface — a module never calls another module's service methods directly.
    methods:
      - name: publish
        args: "<T>(eventType: string, payload: T, correlationId?: UUID)"
        returns: "void"
        description: >
          Wraps payload in an EventEnvelope (auto-generates eventId + occurredAt; generates a new
          correlationId if none is supplied) and emits it synchronously to EventEmitter2. Fire-and-forget:
          the publisher does not wait for subscriber handlers to complete and does not receive their
          return values or errors.
      - name: subscribe
        args: "<T>(eventType: string, handler: (envelope: EventEnvelope<T>) => void | Promise<void>)"
        returns: "Subscription"
        description: >
          Registers a handler for an event type. Handlers may be async. A handler that throws or
          rejects is caught and logged by the bus wrapper — it never crashes the publisher or other
          subscribers (isolation between subscribers is mandatory, see Section 8 of the module file).
      - name: unsubscribe
        args: "(subscription: Subscription)"
        returns: "void"
        description: "Removes a previously registered handler. Used mainly in tests and module teardown."

  IJobQueue:
    description: >
      Queue + worker abstraction for long-running backtest jobs (ADR-0006). The required implementation
      is BullMqJobQueue backed by Redis (ADR-0013); consumers remain isolated from BullMQ classes.
    methods:
      - name: enqueue
        args: "(jobType: string, payload: object & { jobId: UUID }, correlationId?: UUID)"
        returns: "Promise<{ jobId: UUID }>"
        description: >
          Adds a job using the producer-supplied payload.jobId and returns that same ID after Redis
          confirms acceptance, without waiting for backtest execution.
          The adapter passes it as BullMQ's custom jobId, never generates or replaces it, and turns
          BullMQ's duplicate-ID no-op behavior into an explicit conflict. USER jobs use priority 1;
          SEARCH_LOOP jobs use priority 10; equal-priority jobs are FIFO. Enqueue does not execute
          the job synchronously.
      - name: getStatus
        args: "(jobId: UUID)"
        returns: "Promise<JobStatus>"
      - name: retry
        args: "(jobId: UUID)"
        returns: "Promise<void>"
        description: >
          Manually retries a failed BullMQ job with attempt counters reset, while atomically marking
          its PostgreSQL DeadLetterJob mirror resolved. This is operator-triggered recovery;
          automatic retries are handled by BullMQ.
      - name: deadLetter
        args: "(jobId: UUID, reason: string)"
        returns: "Promise<void>"
        description: >
          Finalizes a job in BullMQ's failed set and idempotently mirrors its payload/error to the
          PostgreSQL DeadLetterJob audit record after attempts are exhausted or a non-retriable
          error occurs. Called internally only.
      - name: getStats
        args: "()"
        returns: "Promise<QueueStats>"
        description: "Used by DashboardService and the observability endpoint (Section 7 of the module file)."

# ---------------------------------------------------------------------------
# Retry policy — applies to every job on the queue (BACKTEST is the only job
# type in the MVP). See ADR-0006 and ADR-0013.
# ---------------------------------------------------------------------------
retry_policy:
  maxAttempts: 3
  backoff: custom-bullmq
  delaysMs: [1000, 4000]          # three total attempts: wait 1s before attempt 2 and 4s before attempt 3
  onExhausted: "IJobQueue.deadLetter() is called, then terminal BacktestFailed and BacktestDeadLettered are each published exactly once"
  onNonRetriable: "Skip remaining attempts, call IJobQueue.deadLetter(), then publish terminal BacktestFailed and BacktestDeadLettered exactly once"
  nonRetriableErrors:
    - "Zero historical candles returned for the requested pair/timeframe/date range"
    - "Strategy version not found in registry"

queue_runtime:
  implementation: "BullMqJobQueue"
  queueName: "backtest"
  storage: "Redis with AOF persistence"
  workerTopology: "In-process NestJS BullMQ Worker; separate processes require a cross-process IEventBus"
  concurrencyDefault: 3
  priorities:
    USER: 1
    SEARCH_LOOP: 10
  ordering: "FIFO within the same priority"
  idempotency: "Producer UUID is BullMQ jobId; duplicate IDs return conflict"
  retention: "Completed and failed jobs use bounded age/count policies configured by environment"
  shutdown: "Worker.close() stops new intake and waits for active jobs; ungraceful loss relies on stalled-job recovery"
  deliverySemantics: "At least once around stalls/recovery; worker side effects must be idempotent"

# ---------------------------------------------------------------------------
# Events
# ---------------------------------------------------------------------------
events:
  MarketDataUpdated:
    publisher: "Market Data"
    subscribersOnBus: []
    description: >
      Published whenever a new or updated candle is available for a subscribed symbol/timeframe.
      NOTE: per kb/flows/realtime-market-data.md, the live relay to the frontend is a direct
      WebSocket push from Market Data's own gateway — Event Infrastructure does not currently
      subscribe to this event for any MVP feature. It is kept in this contract so future
      event-driven consumers (e.g. an indicator cache, or a price-reactive strategy) can subscribe
      without introducing a new event type.
    payload:
      symbol: string             # e.g. "BTCUSDT"
      timeframe: string           # e.g. "5m", "1h"
      candle:
        openTime: DateTime
        closeTime: DateTime
        open: float
        high: float
        low: float
        close: float
        volume: float
        isClosed: boolean        # false = still-forming candle (live tick); true = finalized candle
    resolvedQuestions:
      - "Candle field names confirmed in kb/contracts/market-data.yaml (Status: Active, owned by Hoàng). Fields: symbol, timeframe, openTime, closeTime, open, high, low, close, volume, isClosed — matches this payload exactly."

  BacktestRequested:
    publisher: "Strategy Engine when source=USER; Event Infrastructure (Loop Controller) when source=SEARCH_LOOP"
    subscribersOnBus: []
    description: >
      Observational notification published only after a user or Search Loop request has been durably
      accepted by IJobQueue/BullMQ. Each producer creates jobId and correlationId, awaits enqueue,
      then publishes this Event with the same identities. The Job Queue MUST NOT subscribe and
      enqueue from this fire-and-forget Event; doing so could produce false 202 responses or duplicates.
    payload:
      jobId: UUID                      # Generated by the publisher; correlates request to result
      userId: UUID?                    # null = system (SEARCH_LOOP), non-null = user-initiated. See ADR-0016
      strategyVersionId: UUID
      pair: string                     # e.g. "BTCUSDT"
      timeframe: string                # e.g. "1h"
      startDate: DateTime
      endDate: DateTime
      backtestConfig:                  # Mirrors BacktestConfig in kb/contracts/strategy.yaml
        initialCapital: float
        positionSizePercent: float
        commission: float              # nullable
        slippage: float                # nullable
        stopLossPercent: float         # nullable — stop-loss as % from entry price
        takeProfitPercent: float       # nullable — take-profit as % from entry price
      source: BacktestSource           # "USER" | "SEARCH_LOOP"
      loopRunId: UUID                  # nullable — present only when source = "SEARCH_LOOP"
    contractNote: >
      This complete payload is authoritative. Strategy Engine owns the BacktestConfig domain type and
      validates source=USER requests. Event Infrastructure owns event routing metadata and validates
      source=SEARCH_LOOP requests. source=USER requires loopRunId=null; source=SEARCH_LOOP requires a
      non-null loopRunId. kb/contracts/strategy.yaml references this schema instead of redefining it.

  BacktestCompleted:
    publisher: "Event Infrastructure (Job Queue Worker)"
    subscribersOnBus: ["Strategy Engine", "Leaderboard", "Loop Controller"]
    description: >
      Published by the worker after a backtest finishes successfully. Carries an evaluation metrics
      summary so the Leaderboard and Loop Controller can rank/decide without an extra DB round-trip.
      The full trade list stays in BacktestResult, fetched on demand via
      GET /api/strategies/backtest/:id. userId is required on every payload and remains nullable:
      null identifies a system/search-loop backtest and a UUID identifies a user-owned backtest.
    payload:
      jobId: UUID
      correlationId: UUID
      userId: UUID?                    # null = system backtest, non-null = user-initiated. See ADR-0016
      loopRunId: UUID                  # nullable — present only if this backtest originated from the search loop
      backtestResultId: UUID
      strategyVersionId: UUID
      strategyName: string
      strategyType: string             # "MA" | "RSI" | "Bollinger" | "SR" | "Sentiment" | "Composite"
      isComposite: boolean
      pair: string
      timeframe: string
      status: string                   # always "SUCCESS" for this event — see BacktestFailed for failures
      metrics:                         # Mirrors EvaluationMetrics in kb/contracts/strategy.yaml
        totalReturn: float
        winRate: float
        maxDrawdown: float
        sharpeRatio: float
        profitFactor: float
        totalTrades: number
      executedAt: DateTime
      executionTimeMs: number
    contractNote: >
      Ownership propagation is defined by
      sdd_artifacts/per-user-leaderboard-live-toggle/contracts/userid-propagation.md.

  BacktestFailed:
    publisher: "Event Infrastructure (Job Queue Worker)"
    subscribersOnBus: ["Strategy Engine", "Loop Controller"]
    description: >
      Terminal event published exactly once by the Job Queue Worker when a backtest exhausts all retry
      attempts or encounters a non-retriable error (see retry_policy.nonRetriableErrors above).
      Failures from intermediate retryable attempts remain internal queue status/log entries and do
      not publish BacktestFailed.
    payload:
      jobId: UUID
      correlationId: UUID
      loopRunId: UUID                  # nullable
      strategyVersionId: UUID
      error: string
      attempt: number
    resolvedQuestions:
      - "Publisher ownership confirmed: Event Infrastructure's Job Queue Worker is the sole publisher; Strategy Engine and Loop Controller consume the terminal event."
      - "BacktestFailed has terminal-only semantics, so the obsolete retry-intent flag was removed; retryable attempt failures do not emit this event."

  BacktestDeadLettered:
    publisher: "Event Infrastructure (Job Queue)"
    subscribersOnBus: ["Loop Controller"]
    description: >
      Published when a job is moved to the dead-letter queue after exhausting retry_policy.maxAttempts
      or immediately after a non-retriable error.
      Kept distinct from BacktestFailed so the Dashboard can surface a "needs operator attention"
      indicator (via DashboardService.getQueueStats) even for future job types that don't otherwise
      notify Strategy Engine.
    payload:
      jobId: UUID
      correlationId: UUID
      jobType: string
      lastError: string
      attempts: number
      deadLetteredAt: DateTime

  LeaderboardUpdated:
    publisher: "Event Infrastructure (Leaderboard)"
    subscribersOnBus: ["WebSocket Gateway"]
    description: >
      Published after the Leaderboard recomputes Top-K ranking in reaction to BacktestCompleted.
      The WebSocket Gateway relays this to all connected frontend clients on the
      `leaderboard:update` channel (see kb/modules/event-infrastructure.md Section 7). Because this
      event is namespace-wide, topK contains system-owned rows only (every entry has userId=null),
      never private user rows. A private backtest may invalidate viewers by publishing a null trigger,
      but its private result identifier and private Top-K must not be broadcast.
    payload:
      updatedAt: DateTime
      triggeredByBacktestResultId: UUID? # system result UUID, or null when revealing the trigger would leak private ownership
      rankingCriterion: string          # "score" | "totalReturn" | "winRate" | "sharpeRatio"
      topK: LeaderboardEntryPayload[]    # system-only projection; every entry has userId=null
    contractNote: >
      The safe namespace-wide wire shape and frontend refresh behavior are defined by
      sdd_artifacts/per-user-leaderboard-live-toggle/contracts/leaderboard-realtime.md.

  SearchLoopStarted:
    publisher: "Event Infrastructure (Loop Controller)"
    subscribersOnBus: ["WebSocket Gateway"]
    description: "Published when a user starts a new search loop run."
    payload:
      loopRunId: UUID
      config:
        generatorType: string           # "RANDOM" | "DOMAIN_GUIDED"
        maxCandidates: number           # nullable — one of maxCandidates / maxDurationMs must be set
        maxDurationMs: number           # nullable
        stopOnNoImprovementIterations: number   # default 50
      startedAt: DateTime

  SearchLoopProgress:
    publisher: "Event Infrastructure (Loop Controller)"
    subscribersOnBus: ["WebSocket Gateway"]
    description: >
      Published after each candidate finishes evaluation, so the Loop Status Panel updates without
      the frontend polling.
    payload:
      loopRunId: UUID
      iteration: number
      testedCandidates: number
      currentCandidate:
        strategyVersionId: UUID         # nullable while generating
        strategyName: string            # nullable while generating
        status: string                  # "GENERATING" | "BACKTESTING" | "EVALUATING"
      bestScoreSoFar: float             # nullable until first candidate completes
      bestStrategyVersionId: UUID       # nullable until first candidate completes

  SearchLoopStopped:
    publisher: "Event Infrastructure (Loop Controller)"
    subscribersOnBus: ["WebSocket Gateway"]
    description: "Published when a loop run finishes, is stopped by the user, or fails."
    payload:
      loopRunId: UUID
      status: LoopStatus                # "COMPLETED" | "STOPPED_BY_USER" | "FAILED"
      stopReason: string                # e.g. "max_candidates_reached" | "no_improvement_50_iterations" | "user_requested" | "error"
      testedCandidates: number
      bestStrategyVersionId: UUID       # nullable
      bestScore: float                  # nullable
      startedAt: DateTime
      stoppedAt: DateTime

  NewsCollected:
    publisher: "News & Sentiment"
    subscribersOnBus: []
    description: >
      Reserved for future use. As of W1, News & Sentiment does not publish this event: the frontend
      reads news via REST (GET /api/news) and NewsSentimentStrategy reads aggregate sentiment
      directly (see kb/flows/news-sentiment-pipeline.md). Kept in this contract so a future
      push-based sentiment gauge (WebSocket) can subscribe without introducing a new event type.
      Confirm with Thuận before relying on this event actually being published.
    payload:
      articleId: UUID
      relatedCoins: string[]
      sentimentScore: float
      sentimentLabel: string             # "POSITIVE" | "NEGATIVE" | "NEUTRAL"
      publishedAt: DateTime
