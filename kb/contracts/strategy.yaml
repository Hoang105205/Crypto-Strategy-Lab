# Contract: Strategy Engine
# Owner: Huy | Status: Active
# This file is the Single Source of Truth for the Strategy Engine module's API.
# See also: kb/modules/strategy-engine.md, ADR-0003, ADR-0008

entities:
  BacktestConfig:
    fields:
      initialCapital: float       # Starting capital (e.g., 10000)
      positionSizePercent: float  # % of capital per trade
      commission: float?          # Trading fee percentage (e.g., 0.001 = 0.1%)
      slippage: float?            # Slippage simulation rate (e.g., 0.0005 = 5bps)
      stopLossPercent: float?     # Stop-loss as % from entry price (e.g., 0.02 = 2% below entry for LONG)
      takeProfitPercent: float?   # Take-profit as % from entry price (e.g., 0.05 = 5% above entry for LONG)

  EvaluationMetrics:
    fields:
      totalReturn: float
      winRate: float
      maxDrawdown: float
      sharpeRatio: float
      profitFactor: float
      totalTrades: number

  Signal:
    fields:
      action: string           # "BUY" | "SELL" | "HOLD"
      confidence: float?       # Optional confidence score 0-1
      metadata: JSONB?         # Optional strategy-specific data


  StrategyVersion:
    fields:
      id: UUID                        # Primary key
      userId: UUID?                   # null = system-discovered (shared), non-null = user-created (private). See ADR-0016
      strategyType: string            # e.g. "MA", "RSI", "Bollinger", "SR", "Sentiment", "Composite"
      name: string                    # Human-readable name (e.g. "MA-20/50 Crossover")
      version: number                 # Monotonic per strategyType
      parameters: JSONB               # Strategy-specific params (e.g. { periods: [20, 50] })
      parentVersionId: UUID?          # Previous version of this strategy (nullable)
      isComposite: boolean            # True if this is a composite strategy
      childVersionIds: UUID[]?        # Child strategy version IDs (if composite)
      combinerType: string?           # "MajorityVote" | "WeightedScore" (if composite)
      combinerWeights: JSONB?         # Per-child weights (if WeightedScore combiner)
      createdAt: DateTime

  BacktestResult:
    fields:
      id: UUID                        # Primary key
      jobId: UUID                     # Unique producer job ID; create-once idempotency key
      userId: UUID?                   # null = system backtest (from loop), non-null = user-initiated. See ADR-0016
      strategyVersionId: UUID         # FK → StrategyVersion.id
      pair: string                    # e.g. "BTCUSDT"
      timeframe: string              # e.g. "1h", "4h", "1d"
      startDate: DateTime
      endDate: DateTime
      totalReturn: float              # Percentage return
      winRate: float                  # 0.0 – 1.0
      maxDrawdown: float              # Maximum drawdown (negative %)
      sharpeRatio: float              # Risk-adjusted return
      profitFactor: float             # Gross profit / gross loss
      totalTrades: number
      trades: JSONB                   # Array of Trade (see Trade entity below — includes stopLoss, takeProfit, etc.)
      executedAt: DateTime
      executionTimeMs: number

  Trade:
    fields:
      entryDate: DateTime
      exitDate: DateTime
      entryPrice: float
      exitPrice: float
      side: string                    # "LONG" | "SHORT"
      pnl: float                     # Profit/loss percentage
      quantity: float
      stopLoss: float?                # Stop-loss price for this trade (computed from BacktestConfig.stopLossPercent)
      takeProfit: float?              # Take-profit price for this trade (computed from BacktestConfig.takeProfitPercent)
      transactionCost: float?         # Fee charged on this trade (commission rate × trade value)
      slippage: float?                # Actual slippage applied (slippage rate × entry price)
      volumeUsd: float?               # Trade volume in USD (entryPrice × quantity)

enums:
  StrategyType: ["MA", "RSI", "Bollinger", "SR", "Sentiment", "Composite", "MACD", "STOCHASTIC", "ATR"]
  SignalAction: ["BUY", "SELL", "HOLD"]
  CombinerType: ["MajorityVote", "WeightedScore"]

interfaces:
  IStrategy:
    description: "Core strategy interface — all strategies (single + composite) implement this"
    methods:
      - name: analyze
        args: "(candles: Candle[])"
        returns: "Signal"
        description: "Analyze candle data and produce a BUY/SELL/HOLD signal"
      - name: getName
        args: "()"
        returns: "string"
      - name: getType
        args: "()"
        returns: "StrategyType"
      - name: getParameters
        args: "()"
        returns: "Record<string, any>"

  IBacktester:
    description: "Backtesting execution — simulates a strategy over historical candles"
    methods:
      - name: run
        args: "(strategy: IStrategy, candles: Candle[], config: BacktestConfig)"
        returns: "Trade[]"
        description: "Replay candles, simulate trades based on strategy signals"

  IEvaluator:
    description: "Computes evaluation metrics from raw backtest trades"
    methods:
      - name: evaluate
        args: "(trades: Trade[], initialCapital: number)"
        returns: "EvaluationMetrics"
        description: "Compute Return, WinRate, MaxDrawdown, SharpeRatio, ProfitFactor"

  IStrategyGenerator:
    description: "Generates candidate strategies for the search loop"
    methods:
      - name: generate
        args: "(count: number)"
        returns: "IStrategy[]"
        description: "Generate N candidate strategies (Random or Domain-Guided)"

  IStrategyCandidatePort:
    description: >
      Strategy-owned public boundary used by the Search Loop. It selects the
      requested generator, materializes exactly one generated IStrategy as an
      immutable StrategyVersion, and returns only its stable reference.
    methods:
      - name: generateCandidate
        args: "(generatorType: 'RANDOM' | 'DOMAIN_GUIDED')"
        returns: "Promise<{ strategyVersionId: UUID, strategyName: string }>"
        description: >
          The returned ID is the persisted StrategyVersion.id. Callers must not
          synthesize an ID or access StrategyVersion persistence directly.

  ICombiner:
    description: "Combines multiple strategy signals into a single signal"
    methods:
      - name: combine
        args: "(signals: Signal[])"
        returns: "Signal"
        description: "Aggregate signals from child strategies"

endpoints:
  - method: GET
    path: /api/strategies
    description: "List all registered strategies with their parameters"
    response:
      type: "StrategyVersion[]"
      example: '[{ id, strategyType, name, version, parameters, isComposite }]'

  - method: DELETE
    path: /api/strategies/:name
    description: "Delete a specific strategy from the registry"
    response:
      type: "{ message: string }"

  - method: GET
    path: /api/strategies/:id
    description: "Get a specific strategy version by ID"
    response:
      type: "StrategyVersion"

  - method: POST
    path: /api/strategies/composite
    description: "Create a composite strategy from child strategies + combiner"
    request:
      childStrategyNames: "string[]"
      combinerType: '"MajorityVote" | "WeightedScore"'
      combinerWeights: "number[]?    # Required for WeightedScore"
      name: "string"
    response:
      type: "StrategyVersion"

  - method: POST
    path: /api/strategies/backtest
    description: "Submit a backtest request (enqueued via job queue)"
    request:
      strategyName: "string"
      pair: "string                  # e.g. 'BTCUSDT'"
      timeframe: "string             # e.g. '1h'"
      startDate: "DateTime"
      endDate: "DateTime"
      backtestConfig: "BacktestConfig"
    response:
      type: "{ jobId: string, status: 'queued' }"
      semantics: "202 is returned only after IJobQueue/BullMQ confirms Redis acceptance"
    errors:
      - "409 DUPLICATE_JOB_ID"
      - "503 QUEUE_UNAVAILABLE"

  - method: GET
    path: /api/strategies/backtest/:id
    description: "Get backtest result by ID"
    response:
      type: "BacktestResult"

  - method: GET
    path: /api/strategies/:id/versions
    description: "List all versions of a strategy type"
    response:
      type: "StrategyVersion[]"

events_published:
  - name: BacktestRequested
    description: >
      Observational notification published by Strategy Engine only after IJobQueue/BullMQ durably
      accepts a user-submitted job. Strategy Engine generates jobId + correlationId, awaits enqueue,
      sets source=USER and loopRunId=null, then publishes with the same identities. Loop-originated
      notifications follow the same order in Event Infrastructure.
    payload_contract: "kb/contracts/events.yaml#/events/BacktestRequested/payload"

events_consumed:
  - name: BacktestCompleted
    description: "Consumed to link the result and its metrics back to the immutable strategy version"
    published_by: "Event Infrastructure (Job Queue Worker)"
    payload_contract: "kb/contracts/events.yaml#/events/BacktestCompleted/payload"
  - name: BacktestFailed
    description: "Consumed when a backtest reaches terminal failure; Strategy Engine never publishes this event"
    published_by: "Event Infrastructure (Job Queue Worker)"
    payload_contract: "kb/contracts/events.yaml#/events/BacktestFailed/payload"

# Event payloads are defined only in kb/contracts/events.yaml. This module contract records
# Strategy Engine's publish/consume responsibilities without duplicating reduced payload shapes.
