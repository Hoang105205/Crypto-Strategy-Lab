# Contract: News & Sentiment
# Owner: Thuận | Status: Active — SSoT for News & Sentiment module
# This file is the Single Source of Truth for the News & Sentiment module's API and data contracts.

entities:
  NewsArticle:
    fields:
      id: string (uuid)
      source: string # e.g. 'CoinDesk RSS', 'CryptoPanic', 'News API'
      title: string
      content: string
      url: string (unique)
      publishedAt: string (ISO8601)
      crawledAt: string (ISO8601) # Timestamp when collected
      relatedCoins: string[] # e.g. ['BTC', 'ETH']
      sentimentScore: number # -1.0 to 1.0
      sentimentLabel: string # POSITIVE | NEGATIVE | NEUTRAL
      createdAt: string (ISO8601)

  SentimentScore:
    fields:
      id: string (uuid)
      articleId: string (fk -> NewsArticle.id)
      score: number # -1.0 to 1.0
      label: string # POSITIVE | NEGATIVE | NEUTRAL
      model: string # 'VADER'
      scoredAt: string (ISO8601)

  CrawlerRule:
    fields:
      id: string (uuid)
      domain: string # e.g. 'decrypt.co'
      targetUrl: string # e.g. 'https://decrypt.co/news'
      containerSelector: string # e.g. 'article.post-card'
      titleSelector: string # e.g. 'h3.post-title'
      contentSelector: string # e.g. 'p.post-excerpt'
      linkSelector: string # e.g. 'a.story-link'
      dateSelector: string # e.g. 'time'
      isActive: boolean # default true
      lastDiscoveredAt: string (ISO8601)
      createdAt: string (ISO8601)
      updatedAt: string (ISO8601)

interfaces:
  INewsProvider:
    methods:
      - fetchLatest(limit?: number, coin?: string, activeCoins?: string[]): Promise<RawArticle[]>
  
  SentimentClient:
    methods:
      - analyzeText(text: string): Promise<SentimentResult>

  IAdaptiveCrawler:
    methods:
      - discoverSelectors(htmlSample: string, domain: string): Promise<CrawlerRule>
      - extractArticles(html: string, rule: CrawlerRule, activeCoins?: string[]): Promise<RawArticle[]>

endpoints:
  - method: GET
    path: /api/news
    queryParams:
      limit: number # default 10, max 50
      offset: number # default 0 (for offset-based pagination / Load More)
      coin: string # e.g. 'BTC', 'ETH', 'GENERAL', 'ALL' (single coin / general filter)
      coins: string # e.g. 'BTC,ETH,SOL,GENERAL' (comma-separated multi-coin filter)
    response:
      success: boolean
      data: NewsArticle[]
      pagination:
        total: number # total articles matching filter
        limit: number # requested limit
        offset: number # requested offset
        hasMore: boolean # true if offset + limit < total
    notes: "Articles not matching any active TradingPair are tagged with 'GENERAL'. The frontend dynamically retrieves active trading pairs from GET /api/market-data/pairs."

  - method: GET
    path: /api/sentiment/aggregate
    queryParams:
      timeframe: string # '1h' | '24h' | '7d' (default: '24h')
      coin: string # e.g. 'BTC', 'ETH', 'GENERAL' (single coin)
      coins: string # e.g. 'BTC,ETH' (multi-coin filter)
    response:
      score: number # average score -1.0 to 1.0
      label: string # POSITIVE | NEGATIVE | NEUTRAL
      articleCount: number
      updatedAt: string (ISO8601)

internal_service:
  python_sentiment_api:
    endpoint: POST http://localhost:8000/analyze
    request:
      text: string
    response:
      score: number # -1.0 to 1.0
      label: string # POSITIVE | NEGATIVE | NEUTRAL
    notes: "Internal HTTP call from NestJS SentimentClient to Python FastAPI. Never exposed to frontend."
